        /*
         * Loading screen — Expanding Dot Radar
         * 5×5 dot grid with concentric ring activation.
         * ONLY transform + opacity animate → compositor-thread, zero paint.
         *
         * Ring 0 (center):  1 dot  — delay 0s
         * Ring 1 (inner):   8 dots — delay 0.3s
         * Ring 2 (outer):  16 dots — delay 0.6s
         *
         * The pattern expands outward like a radar scan, then resets.
         * Colors are set by the theme-detection script via CSS custom properties.
         */

        @keyframes nl-radar {
            0% {
                opacity: 0.1;
                transform: scale(0.55);
            }

            30% {
                opacity: 1;
                transform: scale(1.2);
            }

            55% {
                opacity: 0.55;
                transform: scale(1);
            }

            100% {
                opacity: 0.1;
                transform: scale(0.55);
            }
        }

        @keyframes nl-fade {
            from {
                opacity: 0;
                transform: translateY(6px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        #native-loader {
            position: fixed;
            inset: 0;
            z-index: 99999;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--nl-bg, #e8e7e5);
            will-change: opacity;
        }

        #native-loader .nl-wrap {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 5×5 dot grid */
        #native-loader .nl-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(5, 1fr);
            width: 110px;
            height: 110px;
            gap: 0;
        }

        /* Individual dot cell */
        #native-loader .nl-dot {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* The visible dot — real element so GSAP can animate it on exit */
        #native-loader .nl-dot i {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--nl-fg, #003934);
            opacity: 0.1;
            transform: scale(0.55);
            will-change: transform, opacity;
            animation: nl-radar 2.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            font-style: normal;
            /* reset italic */
        }

        /* Ring delays — Chebyshev distance from center (2,2) */
        #native-loader .nl-dot[data-r="0"] i {
            animation-delay: 0s;
        }

        #native-loader .nl-dot[data-r="1"] i {
            animation-delay: 0.3s;
        }

        #native-loader .nl-dot[data-r="2"] i {
            animation-delay: 0.6s;
        }

        /* Text container */
        #native-loader .nl-text {
            display: flex;
            gap: .3em;
            margin-top: 28px;
            white-space: nowrap;
            font-family: 'Satoshi', system-ui, sans-serif;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: .08em;
            color: var(--nl-fg, #003934);
        }

        /* Letters fade in with staggered CSS delays — one-shot, compositor-only */
        #native-loader .nl-char {
            opacity: 0;
            display: inline-block;
            animation: nl-fade .5s ease-out forwards;
        }
    </style>
